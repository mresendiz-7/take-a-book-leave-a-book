<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" role="img" aria-label="Little free library house on a post" xmlns:c2pa="http://c2pa.org/manifest">
  <!-- ground -->
  <ellipse cx="200" cy="470" rx="170" ry="22" fill="#8a9a5b" opacity="0.45"/>
  <!-- post -->
  <rect x="182" y="330" width="36" height="140" fill="#8b6040" stroke="#4a3426" stroke-width="3"/>
  <line x1="192" y1="340" x2="192" y2="460" stroke="#6d4a30" stroke-width="2"/>

  <!-- roof -->
  <polygon points="40,150 200,40 360,150" fill="#c7826b" stroke="#4a3426" stroke-width="4" stroke-linejoin="round"/>
  <!-- shingles -->
  <g stroke="#a8644f" stroke-width="2" fill="none">
    <path d="M95 112 Q110 122 125 112 Q140 122 155 112 Q170 122 185 112 Q200 122 215 112 Q230 122 245 112 Q260 122 275 112 Q290 122 305 112"/>
    <path d="M140 80 Q155 90 170 80 Q185 90 200 80 Q215 90 230 80 Q245 90 260 80"/>
    <path d="M68 138 Q83 148 98 138 Q113 148 128 138 Q143 148 158 138 Q173 148 188 138 Q203 148 218 138 Q233 148 248 138 Q263 148 278 138 Q293 148 308 138 Q323 148 338 138"/>
  </g>
  <!-- chimney -->
  <rect x="270" y="60" width="26" height="46" fill="#a8644f" stroke="#4a3426" stroke-width="3"/>

  <!-- house body -->
  <rect x="62" y="145" width="276" height="190" rx="6" fill="#efe3c8" stroke="#4a3426" stroke-width="4"/>

  <!-- window frame + plexiglass -->
  <rect x="88" y="165" width="224" height="150" rx="4" fill="#fffaf0" stroke="#5b6b3a" stroke-width="6"/>
  <!-- shelf -->
  <rect x="94" y="240" width="212" height="6" fill="#8b6040"/>

  <!-- top shelf books -->
  <rect x="100" y="182" width="16" height="58" fill="#3b2a2a"/>
  <rect x="118" y="188" width="13" height="52" fill="#c79a9a"/>
  <rect x="133" y="178" width="18" height="62" fill="#4f6b48"/>
  <rect x="153" y="192" width="12" height="48" fill="#d9b778"/>
  <rect x="167" y="184" width="16" height="56" fill="#2f3e52"/>
  <rect x="185" y="196" width="14" height="44" fill="#9fb07a" transform="rotate(12 192 240)"/>
  <!-- mug -->
  <rect x="234" y="208" width="30" height="32" rx="4" fill="#ead1c4" stroke="#4a3426" stroke-width="2.5"/>
  <path d="M264 214 q14 0 14 10 q0 10 -14 10" fill="none" stroke="#4a3426" stroke-width="2.5"/>
  <path d="M244 222 l3 -3 l3 3 l3 -3 l3 3" fill="none" stroke="#c7826b" stroke-width="2"/>
  <!-- star sticker -->
  <polygon points="284,192 288,202 298,202 290,208 293,218 284,212 275,218 278,208 270,202 280,202" fill="#d6a243"/>

  <!-- bottom shelf: jar of flowers + books -->
  <rect x="104" y="268" width="34" height="40" rx="6" fill="#dfeef0" stroke="#4a3426" stroke-width="2.5" opacity="0.9"/>
  <line x1="114" y1="268" x2="108" y2="252" stroke="#5b6b3a" stroke-width="2.5"/>
  <line x1="121" y1="268" x2="122" y2="248" stroke="#5b6b3a" stroke-width="2.5"/>
  <line x1="128" y1="268" x2="136" y2="254" stroke="#5b6b3a" stroke-width="2.5"/>
  <circle cx="108" cy="250" r="6" fill="#c7826b"/>
  <circle cx="122" cy="245" r="6" fill="#d6a243"/>
  <circle cx="137" cy="252" r="6" fill="#ead1c4" stroke="#c7826b" stroke-width="1.5"/>
  <rect x="150" y="262" width="15" height="46" fill="#6b2d2d"/>
  <rect x="167" y="258" width="18" height="50" fill="#8a9a5b"/>
  <rect x="187" y="266" width="13" height="42" fill="#c7826b"/>
  <rect x="202" y="260" width="16" height="48" fill="#5c5a4a"/>
  <rect x="226" y="290" width="70" height="12" fill="#d9b778" stroke="#4a3426" stroke-width="1.5"/>
  <rect x="230" y="278" width="62" height="12" fill="#4f6b48" stroke="#4a3426" stroke-width="1.5"/>

  <!-- glare on plexiglass -->
  <path d="M110 300 L160 170" stroke="#ffffff" stroke-width="10" opacity="0.45"/>
  <path d="M135 305 L170 210" stroke="#ffffff" stroke-width="4" opacity="0.4"/>
  <!-- knob -->
  <circle cx="300" cy="240" r="6" fill="#d6a243" stroke="#4a3426" stroke-width="2"/>

  <!-- sign -->
  <rect x="118" y="345" width="164" height="34" rx="5" fill="#fffaf0" stroke="#4a3426" stroke-width="2.5"/>
  <text x="200" y="368" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#4a3426">Take one · Leave one</text>

  <!-- flowers at base -->
  <g>
    <line x1="140" y1="470" x2="140" y2="440" stroke="#5b6b3a" stroke-width="3"/>
    <circle cx="140" cy="436" r="8" fill="#c7826b"/>
    <line x1="160" y1="470" x2="162" y2="448" stroke="#5b6b3a" stroke-width="3"/>
    <circle cx="162" cy="444" r="6" fill="#d6a243"/>
    <line x1="240" y1="470" x2="240" y2="444" stroke="#5b6b3a" stroke-width="3"/>
    <circle cx="240" cy="440" r="7" fill="#ead1c4" stroke="#c7826b" stroke-width="2"/>
    <line x1="260" y1="470" x2="262" y2="438" stroke="#5b6b3a" stroke-width="3"/>
    <circle cx="262" cy="434" r="8" fill="#c7826b"/>
    <path d="M120 470 q6 -18 12 0 M268 470 q6 -18 12 0" fill="#8a9a5b"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
